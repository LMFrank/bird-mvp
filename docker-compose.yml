services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=3001
      - SERVE_STATIC=1
      - STATIC_DIR=/app/dist
      - BIRD_AI_URL=http://ai:8000
      - CACHE_DIR=/app/data/cache
      - IDENTIFY_MAX_SIZE=${IDENTIFY_MAX_SIZE:-4096}
      - IDENTIFY_JPEG_QUALITY=${IDENTIFY_JPEG_QUALITY:-90}
      - IDENTIFY_CROPS_SINGLE=${IDENTIFY_CROPS_SINGLE:-9}
      - IDENTIFY_CROPS_BATCH=${IDENTIFY_CROPS_BATCH:-3}
      - IDENTIFY_CROP_SCALE=${IDENTIFY_CROP_SCALE:-0.6}
      - IDENTIFY_CROP_SCALES=${IDENTIFY_CROP_SCALES:-0.6,0.45}
      - IDENTIFY_CROP_SCALES_SINGLE=${IDENTIFY_CROP_SCALES_SINGLE:-0.6,0.45}
      - IDENTIFY_CROP_SCALES_BATCH=${IDENTIFY_CROP_SCALES_BATCH:-0.6,0.45}
      - LLM_FALLBACK_ENABLED=${LLM_FALLBACK_ENABLED:-}
      - LLM_FALLBACK_API_KEY=${LLM_FALLBACK_API_KEY:-}
      - LLM_FALLBACK_URL=${LLM_FALLBACK_URL:-}
      - LLM_FALLBACK_MODEL=${LLM_FALLBACK_MODEL:-}
      - LLM_FALLBACK_CANDIDATES=${LLM_FALLBACK_CANDIDATES:-5}
      - LLM_FALLBACK_TRIGGER_SCORE=${LLM_FALLBACK_TRIGGER_SCORE:-0.6}
      - LLM_FALLBACK_TRIGGER_MARGIN=${LLM_FALLBACK_TRIGGER_MARGIN:-0.1}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - QWEN_BASE_URL=${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - QWEN_MODEL_NAME=${QWEN_MODEL_NAME:-qwen-vl-plus}
    ports:
      - "3001:3001"
    volumes:
      - ./data/cache:/app/data/cache
      - ./sample-photos:/photos:ro
      - ./rejection-photos:/rejection-photos:ro
    depends_on:
      - ai

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    environment:
      - BIOCLIP_MODEL_ID=imageomics/bioclip-2
      - TOPK=5
      - BIRD_LABELS_PATH=/models/labels.csv
      - HF_ENDPOINT=https://hf-mirror.com
      - BIRD_REGION_LABELS_DIR=/models/regions
      - BIRD_CAPTIVE_LABELS_PATH=/models/captive.csv
      - DETECT_ENABLED=${DETECT_ENABLED:-1}
      - DETECT_IMGSZ=${DETECT_IMGSZ:-1280}
      - DETECT_TOP_BOXES=${DETECT_TOP_BOXES:-3}
      - FUSION_STRATEGY=${FUSION_STRATEGY:-max}
      - FUSION_ROI_WEIGHT=${FUSION_ROI_WEIGHT:-1.2}
      - PROMPT_MODE=${PROMPT_MODE:-single}
      - NON_BIRD_MAX_SCORE=${NON_BIRD_MAX_SCORE:-0}
    volumes:
      - ./data/models:/models
